# SonarQube / SonarCloud Configuration for HiddenJobs Hunter
sonar.projectKey=hidden-jobs-hunter
sonar.projectName=HiddenJobs Hunter
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Source and Test Directories
sonar.sources=backend,frontend/src
sonar.tests=backend/HiddenJobsHunter.Tests,frontend/tests

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/bin/**,**/obj/**,**/TestResults/**,**/*.db,**/*.db-shm,**/*.db-wal,backend/HiddenJobsHunter.Tests/**,frontend/tests/**,frontend/*.config.ts
sonar.test.inclusions=backend/HiddenJobsHunter.Tests/**/*Tests.cs,frontend/tests/**/*.test.ts,frontend/tests/**/*.test.tsx

# Code Coverage Reports (C# OpenCover + TypeScript LCOV)
sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
